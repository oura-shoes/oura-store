<style>
:root{--ink:#2C2220;--nude:#D4A392;--cream:#FDFBF9;--card:#F7F2EE;--line:#E8DDD6;--mut:#7a6a64}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:hidden}
body{font-family:Tajawal,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:72px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--nude);outline-offset:2px}
.serif{font-family:'Playfair Display','Cormorant Garamond',serif}
header{position:sticky;top:0;z-index:20;background:rgba(253,251,249,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.logo{display:flex;flex-direction:column;align-items:center;line-height:1;direction:ltr}
.logo img{height:40px;display:block}
.logo b{font:600 26px 'Playfair Display',serif;letter-spacing:.12em}
.logo small{font:600 8px 'Cormorant Garamond',serif;letter-spacing:.3em}

.ib{padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:14px}
.cartb{background:var(--ink);color:var(--cream);border-radius:99px;padding:9px 16px;font-size:14px}
#search{display:none;padding:0 14px 10px;max-width:1200px;margin:auto}
#search.on{display:block}
#search input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.pills{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;max-width:1200px;margin:auto;scrollbar-width:none}
.pill{white-space:nowrap;padding:7px 16px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:14px}
.pill.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.hero{text-align:center;padding:34px 16px 18px}
.hero h1{font:500 clamp(30px,8vw,54px)/1.1 'Playfair Display',serif;letter-spacing:.14em}
.hero p{font:600 13px 'Cormorant Garamond',serif;letter-spacing:.4em;color:var(--mut);margin-top:8px;direction:ltr}
.note{max-width:900px;margin:12px auto;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--mut);text-align:center}
.filters{display:none;gap:10px;flex-wrap:wrap;max-width:1200px;margin:8px auto;padding:0 14px}
.filters.on{display:flex}

.info{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}

.sz{min-width:38px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;position:relative;direction:ltr;font-size:14px}
.sz.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);position:relative}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.x{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.sw.x::after,.sz.x::after{content:'×';position:absolute;inset:0;display:grid;place-items:center;font-size:22px;line-height:1;color:#a33;text-decoration:none}

footer{text-align:center;padding:30px 14px 90px;color:var(--mut);font-size:13px}

#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:99px;z-index:60;font-size:14px;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
window.addEventListener('error',e=>{const g=document.getElementById('grid');if(g&&!g.children.length)g.textContent='خطأ: '+e.message});

/* ===== CONFIG ===== */
const CURRENCY='د.ج';
const ADMIN_PIN='22012005';
EMAILJS={PUBLIC_KEY:'JTGC4Gq0uCMrjnwb8',SERVICE_ID:'service_ijucjt7',TEMPLATE_ID:'template_paxfogy'};

const OWNER_EMAIL='oura.shoes.dz@gmail.com';
const DEFAULT_GH={owner:'',repo:'oura-store',branch:'main'};

const C=(n,hex,a=true,image='')=>({n,hex,available:a,image});
const S=(arr,off=[])=>[36,37,38,39,40,41].filter(s=>arr.includes(s)).map(s=>({s,available:!off.includes(s)}));

/* احتياط في حال لم يُنشر products.json بعد */
const DEFAULT_PRODUCTS=[
{id:1795769026155,name:"J-04",cat:"heels",price:2900,img:"images/J-04-k.jpg",date:"2026-11-27",
 colors:[C("كاكي","#A68A64",true,"images/J-04-k.jpg"),C("أسود","#111111",true,"images/J-04-B.jpg")],
 sizes:S([37,38,39]),stock:[[1,1,1],[0,0,1]]},
{id:1795769258700,name:"J-02",cat:"heels",price:2900,img:"images/J-02.jpg",date:"2026-11-27",
 colors:[C("بيج","#D8B898",true,"images/J-02.jpg")],
 sizes:S([37]),stock:[[1]]},
{id:1795769424547,name:"J-03",cat:"heels",price:2900,img:"images/J-03.jpg",date:"2026-11-27",
 colors:[C("بني داكن","#3E2A24",true,"images/J-03.jpg")],
 sizes:S([37]),stock:[[1]]},
{id:1795769526900,name:"J-05",cat:"heels",price:2900,img:"images/J-05.jpg",date:"2026-11-27",
 colors:[C("بني","#4E342E",true,"images/J-05.jpg")],
 sizes:S([39]),stock:[[1]]},
{id:1795769600001,name:"J-06",cat:"heels",price:2900,img:"images/J-06-B.jpg",date:"2026-11-27",
 colors:[C("أسود","#111111",true,"images/J-06-B.jpg")],
 sizes:S([37,38]),stock:[[1,1]]},
{id:1795769700002,name:"J-07",cat:"heels",price:2900,img:"images/J-07.jpg",date:"2026-11-27",
 colors:[C("أسود","#111111",true,"images/J-07.jpg")],
 sizes:S([39]),stock:[[1]]}
];

const CATS=[['all','الكل'],['heels','كعب'],['everyday','يومي'],['sandals','صندل'],['sneakers','سنيكرز'],['boots','بوت']];
const catName=k=>(CATS.find(c=>c[0]===k)||[,k])[1];

const stq=(p,ci,si)=>{const v=p.stock&&p.stock[ci]&&p.stock[ci][si];return v==null?Infinity:+v};
const cOK=(p,ci)=>p.colors[ci].available&&p.sizes.some((z,si)=>z.available&&stq(p,ci,si)>0);
const sOK=(p,si,ci)=>p.sizes[si].available&&(ci==null?p.colors.some((c,i)=>c.available&&stq(p,i,si)>0):(p.colors[ci].available&&stq(p,ci,si)>0));

/* ===== STATE ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US')+' '+CURRENCY;
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

let products=load('oura_products_cache',DEFAULT_PRODUCTS);
if(!Array.isArray(products)||!products.length)products=DEFAULT_PRODUCTS;
let cart=load('oura_cart',[]);
let sel={},cat='all';

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)}
function openSheet(h){$('#sheet').innerHTML=h;$('#ov').classList.add('on')}

$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'||e.target.dataset.close!==undefined)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ===== LOAD PRODUCTS FROM products.json ===== */
async function syncProductsFromRepo(){
 try{
  const res=await fetch('products.json?t='+Date.now(),{cache:'no-store'});
  if(res.ok){
   const data=await res.json();
   if(Array.isArray(data)&&data.length){
    products=data;
    save('oura_products_cache',products);
    colorOpts();render();
   }
  }
 }catch(e){}
}

/* ===== GITHUB API HELPERS ===== */
function getGh(){
 const saved=load('oura_gh',{});
 const ownerFromHost=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'';
 return {
  owner:saved.owner||ownerFromHost||DEFAULT_GH.owner,
  repo:saved.repo||DEFAULT_GH.repo,
  branch:saved.branch||DEFAULT_GH.branch,
  token:saved.token||''
 };
}
function utf8ToB64(str){
 const bytes=new TextEncoder().encode(str);
 let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
 return btoa(bin);
}
function b64ToUtf8(b64){
 const bin=atob(b64.replace(/\s+/g,''));
 const bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 return new TextDecoder().decode(bytes);
}
function shrinkImage(file,maxSide=1000,quality=0.82){
 return new Promise((resolve,reject)=>{
  const fr=new FileReader();
  fr.onload=ev=>{
   const img=new Image();
   img.onload=()=>{
    const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*scale);
    c.height=Math.round(img.height*scale);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const dataUrl=c.toDataURL('image/jpeg',quality);
    resolve(dataUrl.split(',')[1]);
   };
   img.onerror=()=>reject(new Error('تعذرت قراءة الصورة'));
   img.src=ev.target.result;
  };
  fr.onerror=()=>reject(new Error('تعذر فتح الملف'));
  fr.readAsDataURL(file);
 });
}
async function ghApi(path,token,opts={}){
 const res=await fetch('https://api.github.com'+path,{
  ...opts,
  headers:{
   'Authorization':'Bearer '+token,
   'Accept':'application/vnd.github+json',
   'Content-Type':'application/json',
   ...(opts.headers||{})
  }
 });
 if(!res.ok){
  let msg='HTTP '+res.status;
  try{const j=await res.json();if(j.message)msg+=': '+j.message}catch(e){}
  throw new Error(msg);
 }
 return res.json();
}
async function ghGetFile(gh,filePath){
 try{
  const encPath=filePath.split('/').map(encodeURIComponent).join('/');
  return await ghApi(`/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}/contents/${encPath}?ref=${encodeURIComponent(gh.branch)}`,gh.token);
 }catch(e){
  if(String(e.message).includes('404'))return null;
  throw e;
 }
}
async function ghPutFile(gh,filePath,base64Content,message,sha=null){
 const encPath=filePath.split('/').map(encodeURIComponent).join('/');
 const body={message,content:base64Content,branch:gh.branch};
 if(sha)body.sha=sha;
 return ghApi(`/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}/contents/${encPath}`,gh.token,{
  method:'PUT',
  body:JSON.stringify(body)
 });
}
async function publishProductsToGitHub(list,commitMsg,statusEl){
 const gh=getGh();
 if(!gh.owner||!gh.repo||!gh.token)throw new Error('يرجى إدخال بيانات GitHub والـ Token وحفظها أولاً.');
 if(statusEl){statusEl.classList.add('on');statusEl.textContent='جارٍ تحديث products.json على GitHub...'}
 const existing=await ghGetFile(gh,'products.json');
 const b64=utf8ToB64(JSON.stringify(list,null,2));
 await ghPutFile(gh,'products.json',b64,commitMsg,existing?existing.sha:null);
 products=list;
 save('oura_products_cache',products);
 colorOpts();render();
}

/* ===== STOREFRONT ===== */
function pills(){$('#pills').innerHTML=CATS.map(([k,n])=>`<button class="pill ${k===cat?'on':''}" data-cat="${k}">${n}</button>`).join('')}
function colorOpts(){const set=[...new Set(products.flatMap(p=>p.colors.map(c=>c.n)))];const f=$('#fColor'),v=f.value;f.innerHTML='<option value="">كل الألوان</option>'+set.map(c=>`<option>${esc(c)}</option>`).join('');f.value=v}
function picker(p){
 const s=sel[p.id]||{};
 const left=(s.color!=null&&s.size!=null)?stq(p,s.color,s.size):Infinity;
 return `<div class="lbl">اللون</div><div class="opts" data-pk="c${p.id}">${p.colors.map((c,i)=>{const ok=cOK(p,i);return `<button class="sw ${ok?'':'x'} ${s.color===i?'on':''}" style="background:${esc(c.hex)}" title="${esc(c.n)}${ok?'':' (غير متوفر)'}" aria-label="${esc(c.n)}" ${ok?'':'disabled aria-disabled="true"'} data-pick="color" data-pid="${p.id}" data-i="${i}"></button>`}).join('')}</div>
 <div class="lbl">المقاس</div><div class="opts" data-pk="s${p.id}">${p.sizes.map((z,i)=>{const ok=sOK(p,i,s.color);return `<button class="sz ${ok?'':'x'} ${s.size===i?'on':''}" ${ok?'':'disabled aria-disabled="true"'} aria-label="${z.s}${ok?'':' غير متوفر'}" data-pick="size" data-pid="${p.id}" data-i="${i}">${z.s}</button>`}).join('')}</div>${left<=5?`<div class="lbl">المتوفر: ${left}</div>`:''}`}
const imgSrc=(p,ci)=>(ci!=null&&p.colors[ci]&&p.colors[ci].image)||p.image||p.img||'';
function imgHTML(p){const src=imgSrc(p,(sel[p.id]||{}).color);return `<div class="img" data-open="${p.id}" data-pid="${p.id}" role="button" tabindex="0" aria-label="تفاصيل ${esc(p.name)}"><img src="${esc(src)}" data-src="${esc(src)}" data-fb="${esc(p.image||p.img||'')}" alt="${esc(p.name)}" loading="lazy" ${src?'':'hidden'} onerror="if(this.dataset.fb&&!this.dataset.t&&this.src!==this.dataset.fb){this.dataset.t=1;this.src=this.dataset.fb}else this.hidden=true">OURA</div>`}
function setImg(pid){
 const p=products.find(x=>x.id==pid),src=imgSrc(p,(sel[pid]||{}).color);
 document.querySelectorAll(`.img[data-pid="${pid}"] img`).forEach(im=>{
  if(im.dataset.src===src)return;
  im.dataset.src=src;im.style.opacity=0;
  setTimeout(()=>{im.dataset.t='';im.onload=()=>{im.hidden=false;im.style.opacity=1};if(!src){im.hidden=true;return}im.hidden=false;im.src=src},200);
 });
}
function cardHTML(p){return `<article class="card" id="p${p.id}">${imgHTML(p)}<div class="info"><h3>${esc(p.name)}</h3><div class="meta"><span>${catName(p.cat)}</span><span class="price">${fmt(p.price)}</span></div><div class="pick" data-box="${p.id}">${picker(p)}</div><button class="add" data-add="${p.id}">أضيفي إلى السلة</button></div></article>`}
function render(){
 const q=$('#q').value.trim().toLowerCase(),col=$('#fColor').value,mn=+$('#fMin').value||0,mx=+$('#fMax').value||Infinity,so=$('#sort').value;
 let l=products.filter(p=>(cat==='all'||p.cat===cat)&&p.price>=mn&&p.price<=mx&&(!col||p.colors.some(c=>c.n===col))&&(!q||(p.name+catName(p.cat)).toLowerCase().includes(q)));
 l.sort((a,b)=>so==='asc'?a.price-b.price:so==='desc'?b.price-a.price:(b.date||'').localeCompare(a.date||''));
 $('#grid').innerHTML=l.length?l.map(cardHTML).join(''):'<div class="empty">لا توجد نتائج. جرّبي تغيير التصفية.</div>';
 pills();
}
function refreshPick(pid){document.querySelectorAll(`[data-box="${pid}"]`).forEach(b=>b.innerHTML=picker(products.find(p=>p.id==pid)))}

/* ===== CART ===== */
const cartCount=()=>cart.reduce((a,i)=>a+i.qty,0);
const cartTotal=()=>cart.reduce((a,i)=>{const p=products.find(x=>x.id===i.pid);return a+(p?p.price*i.qty:0)},0);
function updCart(){save('oura_cart',cart);$('#cCount').textContent=cartCount();$('#cTot').textContent=fmt(cartTotal())}
function add(pid){
 const p=products.find(x=>x.id==pid),s=sel[pid]||{},box=document.querySelectorAll(`[data-box="${pid}"]`);
 if(s.color==null||s.size==null){
  box.forEach(b=>{if(s.color==null)b.querySelector('[data-pk^=c]').classList.add('miss');if(s.size==null)b.querySelector('[data-pk^=s]').classList.add('miss')});
  return toast('اختاري اللون والمقاس أولاً');}
 const c=p.colors[s.color],z=p.sizes[s.size];
 if(!cOK(p,s.color)||!sOK(p,s.size,s.color))return toast('الخيار غير متوفر');
 const ex=cart.find(i=>i.pid==pid&&i.color===c.n&&i.size===z.s);
 if((ex?ex.qty:0)+1>stq(p,s.color,s.size))return toast('الكمية المتوفرة: '+stq(p,s.color,s.size));
 ex?ex.qty++:cart.push({pid:p.id,color:c.n,size:z.s,qty:1});
 updCart();toast('أُضيف إلى السلة ✓');
}
function cartView(){
 if(!cart.length)return openSheet(`<h2>السلة <button data-close>✕</button></h2><div class="empty">سلتك فارغة.</div>`);
 openSheet(`<h2>سلة الطلبات <button data-close aria-label="إغلاق">✕</button></h2>
 <div class="note" style="margin:0 0 8px">الطلبات للمنطقة المحلية فقط. سنتصل بك هاتفياً أو عبر البريد لتأكيد التوفر وتحديد مكان التسليم.</div>
 ${cart.map((i,n)=>{const p=products.find(x=>x.id===i.pid)||{name:'؟',price:0};return `<div class="row"><div class="t"><b>${esc(p.name)}</b><br><small>${esc(i.color)} · مقاس ${i.size}</small></div><div class="q"><button data-q="${n}" data-d="-1">−</button> ${i.qty} <button data-q="${n}" data-d="1">+</button></div><b>${fmt(p.price*i.qty)}</b></div>`}).join('')}
 <div class="tot"><span>المجموع</span><span>${fmt(cartTotal())}</span></div>
 <div class="f"><label for="cn">الاسم الكامل *</label><input id="cn" autocomplete="name"></div>
 <div class="f"><label for="cp">رقم الهاتف *</label><input id="cp" type="tel" autocomplete="tel" dir="ltr"></div>
 <div class="f"><label for="ce">البريد الإلكتروني (اختياري)</label><input id="ce" type="email" dir="ltr"></div>
 <div class="f"><label for="cm">الحي / مكان اللقاء المفضل (اختياري)</label><input id="cm"></div>
 <div id="err" style="color:#a33;font-size:13px"></div>
 <button class="btn" id="send">إرسال الطلب</button>
 <button class="btn alt" id="copy">نسخ ملخص الطلب</button>`);
}
function summary(){
 const f={n:$('#cn').value.trim(),p:$('#cp').value.trim(),e:$('#ce').value.trim(),m:$('#cm').value.trim()};
 const lines=cart.map(i=>{const p=products.find(x=>x.id===i.pid);return `- ${p.name} | اللون: ${i.color} | المقاس: ${i.size} | الكمية: ${i.qty} | ${fmt(p.price*i.qty)}`}).join('\n');
 const txt=`طلب جديد من متجر OURA\n\n${lines}\n\nالمجموع: ${fmt(cartTotal())}\n\nالاسم: ${f.n}\nالهاتف: ${f.p}\nالبريد: ${f.e||'-'}\nمكان اللقاء: ${f.m||'-'}`;
 return {f,txt};
}
function valid(f){
 const e=$('#err');
 if(!f.n||!f.p){e.textContent='الاسم ورقم الهاتف مطلوبان.';return false}
 if(!/^[\d\s+()-]{8,}$/.test(f.p)){e.textContent='رقم الهاتف غير صالح.';return false}
 if(f.e&&!/^\S+@\S+\.\S+$/.test(f.e)){e.textContent='البريد الإلكتروني غير صالح.';return false}
 e.textContent='';return true;
}
function done(){
 cart=[];updCart();
 openSheet(`<div class="ok"><div style="font-size:42px">🤍</div><h2 style="justify-content:center">تم استلام طلبك</h2><p>سنتواصل معك قريباً عبر الهاتف أو البريد لتأكيد التوفر وتحديد مكان التسليم.</p><p style="margin-top:10px">للتواصل معنا مباشرة:<br><a href="mailto:${esc(OWNER_EMAIL)}" dir="ltr" style="color:var(--ink);font-weight:700">${esc(OWNER_EMAIL)}</a></p><button class="btn" data-close>حسناً</button></div>`);
}
async function sendOrder(){
 const {f,txt}=summary();if(!valid(f))return;
 const ready=EMAILJS.PUBLIC_KEY!=='YOUR_PUBLIC_KEY'&&window.emailjs;
 if(!ready){$('#err').textContent='لم يتم ضبط EmailJS بعد. انسخي ملخص الطلب وأرسليه لنا.';return}
 const b=$('#send');b.disabled=true;b.textContent='جارٍ الإرسال...';
 try{
  emailjs.init({publicKey:EMAILJS.PUBLIC_KEY});
  await emailjs.send(EMAILJS.SERVICE_ID,EMAILJS.TEMPLATE_ID,{customer_name:f.n,customer_phone:f.p,customer_email:f.e,meeting_spot:f.m,order_details:txt,total:fmt(cartTotal())});
  done();
 }catch(err){b.disabled=false;b.textContent='إرسال الطلب';$('#err').textContent='تعذّر الإرسال. انسخي ملخص الطلب كبديل.'}
}
async function copyOrder(){
 const {f,txt}=summary();if(!valid(f))return;
 try{await navigator.clipboard.writeText(txt);toast('تم نسخ الملخص ✓')}
 catch(e){const t=document.createElement('textarea');t.value=txt;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('تم نسخ الملخص ✓')}
}

 </details>

 <h3 class="serif" style="margin:12px 0 6px">إضافة ونشر حذاء جديد</h3>
 <div class="f"><label>اسم الموديل *</label><input id="nName" placeholder="مثال: J-08"></div>
 <div class="f"><label>الفئة *</label><select id="nCat">${CATS.slice(1).map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div>
 <div class="f"><label>السعر (${CURRENCY}) *</label><input id="nPrice" type="number" min="0" placeholder="2900"></div>
 <div class="f"><label>الصورة الرئيسية من هاتفك *</label><input id="nImgFile" type="file" accept="image/*"></div>
 <div class="f">

  <button type="button" class="btn alt" id="addColorRow" style="padding:8px;font-size:13px">+ إضافة لون آخر</button>
 </div>

 <div class="f"><label>الكمية لكل لون ومقاس (اتركيه فارغاً = غير محدود)</label><input id="nStk" type="number" min="0" inputmode="numeric" placeholder="مثال: 1"></div>
 <div id="pubStatus" class="st-msg"></div>
 <button class="btn" id="aPublish">نشر المنتج إلى المتجر (رفع إلى GitHub)</button>

 <hr style="margin:18px 0;border:0;border-top:1px solid var(--line)">
 <h3 class="serif" style="margin-bottom:6px">إدارة المنتجات الحالية</h3>
 <button class="btn alt" id="aSyncNow">نشر تعديلات المخزون/الحذف الحالية إلى GitHub</button>

 ${products.map(p=>`<div class="apr"><b>${esc(p.name)}</b> · ${fmt(p.price)} <button data-del="${p.id}" style="float:left;color:#a33">حذف</button>
 <div class="opts">${p.colors.map((c,i)=>`<button class="sw ${c.available?'':'x'}" style="background:${esc(c.hex)}" title="${esc(c.n)}" aria-label="تبديل ${esc(c.n)}" data-tg="c" data-pid="${p.id}" data-i="${i}"></button>`).join('')}</div>
 ${p.colors.map((c,ci)=>`<div class="lbl">المخزون — ${esc(c.n)} (فارغ = غير محدود)</div><div class="opts">${p.sizes.map((z,si)=>`<label style="font-size:11px;direction:ltr;text-align:center">${z.s}<input type="number" min="0" inputmode="numeric" style="width:50px;padding:5px;border:1px solid var(--line);border-radius:6px;display:block" value="${stq(p,ci,si)===Infinity?'':stq(p,ci,si)}" data-stk data-pid="${p.id}" data-ci="${ci}" data-si="${si}"></label>`).join('')}</div>`).join('')}
 <div class="opts">${p.sizes.map((z,i)=>`<button class="sz ${z.available?'':'x'}" data-tg="s" data-pid="${p.id}" data-i="${i}">${z.s}</button>`).join('')}</div></div>`).join('')}`);

async function publishNewProduct(){
 const gh=getGh();
 const st=$('#pubStatus');
 const showSt=(m)=>{st.classList.add('on');st.textContent=m};

 if(!gh.owner||!gh.repo||!gh.token){
  showSt('يرجى فتح "إعدادات النشر المباشر على GitHub" بالأعلى وإدخال اسم المستخدم والـ Token وحفظهما أولاً.');
  return;
 }

 const name=$('#nName').value.trim();
 const catVal=$('#nCat').value;
 const price=+$('#nPrice').value;
 const mainFile=$('#nImgFile').files[0];
 const sizes=$('#nSz').value.split(/[,،]/).map(s=>parseInt(s.trim())).filter(Boolean).map(s=>({s,available:true}));

 const rowEls=[...document.querySelectorAll('#colorRows .crow')];
 const rawColors=rowEls.map(r=>({
  n:r.querySelector('.c-name').value.trim(),
  hex:r.querySelector('.c-hex').value||'#cccccc',
  file:r.querySelector('.c-file').files[0]||null
 })).filter(c=>c.n);

 if(!name||!price||!mainFile||!rawColors.length||!sizes.length){
  showSt('أكملي الاسم، السعر، الصورة الرئيسية، لون واحد على الأقل، والمقاسات.');
  return;
 }

 const btn=$('#aPublish');
 btn.disabled=true;

 try{
  const stamp=Date.now();
  const slug=name.replace(/[^a-zA-Z0-9_-]/g,'')||'item';

  // 1. جلب أحدث قائمة منتجات من GitHub أولاً لتفادي الكتابة فوق أي منتج سابق
  showSt('1/3 جارٍ التحقق من المستودع...');
  const existingJson=await ghGetFile(gh,'products.json');
  let baseList=[...products];
  let jsonSha=null;
  if(existingJson&&existingJson.content){
   jsonSha=existingJson.sha;
   const parsed=JSON.parse(b64ToUtf8(existingJson.content));
   if(Array.isArray(parsed))baseList=parsed;
  }

  // 2. تصغير ورفع الصورة الرئيسية
  showSt('2/3 جارٍ ضغط ورفع الصور إلى GitHub...');
  const mainB64=await shrinkImage(mainFile);
  const mainPath=`images/${slug}-${stamp}.jpg`;
  await ghPutFile(gh,mainPath,mainB64,`Upload ${mainPath}`);

  // 3. رفع صور الألوان الإضافية إن وُجدت
  const colors=[];
  for(let i=0;i<rawColors.length;i++){
   const rc=rawColors[i];
   let cImgPath=mainPath;
   if(rc.file){
    const cB64=await shrinkImage(rc.file);
    cImgPath=`images/${slug}-${stamp}-c${i+1}.jpg`;
    await ghPutFile(gh,cImgPath,cB64,`Upload ${cImgPath}`);
   }
   colors.push(C(rc.n,rc.hex,true,cImgPath));
  }

  const q0=$('#nStk').value===''?null:Math.max(0,parseInt($('#nStk').value)||0);
  const newProd={
   id:stamp,
   name,
   cat:catVal,
   price,
   img:mainPath,
   date:new Date().toISOString().slice(0,10),
   colors,
   sizes,
   stock:colors.map(()=>sizes.map(()=>q0))
  };

  const updatedList=[newProd,...baseList];

  // 4. تحديث products.json
  showSt('3/3 جارٍ نشر المنتج في المتجر...');
  await ghPutFile(gh,'products.json',utf8ToB64(JSON.stringify(updatedList,null,2)),`Add product ${name}`,jsonSha);

  products=updatedList;
  save('oura_products_cache',products);
  colorOpts();render();
  toast('تم النشر بنجاح ✓ سيظهر للزبونات خلال دقيقة');
  adminView();
 }catch(err){
  showSt('فشل النشر: '+(err.message||err));
 }finally{
  btn.disabled=false;
 }
}

/* ===== EVENTS ===== */
document.addEventListener('click',async e=>{
 const t=e.target.closest('button,[data-open]');if(!t)return;const d=t.dataset;
 if(d.cat){cat=d.cat;render()}
 else if(d.pick){const s=sel[d.pid]=sel[d.pid]||{};s[d.pick]=+d.i;if(d.pick==='color'&&s.size!=null&&!sOK(products.find(x=>x.id==d.pid),s.size,s.color))delete s.size;refreshPick(d.pid);if(d.pick==='color')setImg(d.pid)}
 else if(d.add)add(d.add);
 else if(d.open)quick(d.open);
 else if(d.q){const i=cart[d.q];if(+d.d>0){const p=products.find(x=>x.id===i.pid);const mx=p?stq(p,p.colors.findIndex(c=>c.n===i.color),p.sizes.findIndex(z=>z.s===i.size)):Infinity;if(i.qty+1>mx)return toast('الكمية المتوفرة: '+mx)}i.qty+=+d.d;if(i.qty<1)cart.splice(d.q,1);updCart();cartView()}
 else if(d.tg){const p=products.find(x=>x.id==d.pid);const o=d.tg==='c'?p.colors[d.i]:p.sizes[d.i];o.available=!o.available;save('oura_products_cache',products);colorOpts();render();adminView();toast('تم التعديل محلياً — اضغطي نشر التعديلات لحفظها للزبونات')}
 else if(d.del){if(confirm('حذف هذا المنتج؟')){products=products.filter(x=>x.id!=d.del);save('oura_products_cache',products);colorOpts();render();adminView();toast('تم الحذف محلياً — اضغطي نشر التعديلات لتحديث المتجر')}}
 else if(d.rmCrow){const rows=document.querySelectorAll('#colorRows .crow');if(rows.length>1)t.closest('.crow').remove();else toast('يجب وجود لون واحد على الأقل')}
 else if(t.id==='addColorRow'){$('#colorRows').insertAdjacentHTML('beforeend',colorRowHTML('', '#111111'))}
 else if(t.id==='ghSave'){
  save('oura_gh',{
   owner:$('#ghOwner').value.trim(),
   repo:$('#ghRepo').value.trim()||'oura-store',
   branch:$('#ghBranch').value.trim()||'main',
   token:$('#ghToken').value.trim()
  });
  toast('تم حفظ إعدادات GitHub ✓');
  adminView();
 }
 else if(t.id==='aPublish')publishNewProduct();
 else if(t.id==='aSyncNow'){
  t.disabled=true;
  try{
   await publishProductsToGitHub(products,'Update products inventory/status',$('#pubStatus'));
   toast('تم نشر التعديلات للجميع ✓');
  }catch(err){toast(err.message||'خطأ في النشر')}
  finally{t.disabled=false}
 }
 else if(t.id==='send')sendOrder();
 else if(t.id==='copy')copyOrder();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.open)quick(e.target.dataset.open)});
const tog=id=>$(id).classList.toggle('on');
$('#sBtn').onclick=$('#mS').onclick=()=>{tog('#search');$('#q').focus()};
$('#mF').onclick=()=>tog('#filters');
$('#cBtn').onclick=$('#mC').onclick=cartView;
$('#admBtn').onclick=()=>{const p=prompt('أدخلي رمز الإدارة');if(p===null)return;p===ADMIN_PIN?adminView():toast('رمز غير صحيح')};
['#q','#fColor','#fMin','#fMax','#sort'].forEach(s=>$(s).addEventListener('input',render));
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.stk!==undefined){
  const p=products.find(x=>x.id==t.dataset.pid),ci=+t.dataset.ci,si=+t.dataset.si;
  p.stock=p.stock||[];p.stock[ci]=p.stock[ci]||[];
  p.stock[ci][si]=t.value===''?null:Math.max(0,parseInt(t.value)||0);
  save('oura_products_cache',products);colorOpts();render();
  toast('تم حفظ المخزون محلياً — اضغطي نشر التعديلات');
 }
});

colorOpts();render();updCart();syncProductsFromRepo();
</script>
